# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=false
# gradle.properties
kotlin.code.style=official
kotlin.incremental=true
kotlin.dsl.source.download=false
# 禁用 JDK 自动探测，避免 Kotlin DSL 解析 Java 25+ 版本号时崩溃
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
# 强制 Gradle 使用 Java 17
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
# 网络：强制 IPv4 + 读取系统 HTTP_PROXY (127.0.0.1:18080)。
# 否则 curl 能连但 JVM 里直连出网超时。
org.gradle.jvmargs=\
  -Djava.net.preferIPv4Stack=true \
  -Djava.net.preferIPv6Addresses=false \
  -Dhttp.proxyHost=127.0.0.1 \
  -Dhttp.proxyPort=18080 \
  -Dhttps.proxyHost=127.0.0.1 \
  -Dhttps.proxyPort=18080 \
  -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local \
  -Xmx3g -XX:MaxMetaspaceSize=512m