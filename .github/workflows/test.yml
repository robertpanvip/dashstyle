name: Test DashStyle Plugin

# 对齐 Json2Typescript 的工作流风格：main 分支 push + 所有 PR 进 main 都会触发
# 支持手动 workflow_dispatch，方便点按钮试跑
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:


jobs:

  # ------------------------------------------------------------------
  # Job 1: 跑 IntelliJ Platform Gradle 插件的编译/打包（compileKotlin /
  #        compileTestKotlin / buildPlugin）。-x test 跳过 Gradle Test Executor，
  #        因为它依赖 IntelliJ sandbox，CI 里 JDK 版本组合容易起不来。
  #        逻辑级单测交给 Job 2 的 3 个独立 Verifier（纯 Java，0 环境依赖）。
  # ------------------------------------------------------------------
  plugin-build:
    name: Plugin compile & buildPlugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        id: setup_jdk
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # gradle.properties 里有两处「只适用于本地 trae 开发机」的硬编码，
      # 直接放到 GitHub Actions 海外 runner 会炸：
      #
      #   1) org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
      #      → CI 没有这路径，setup-gradle 一 provision 完 Gradle 8.14 就会在内部
      #        执行 gradle -version 之类的试跑，报：
      #        "The process '/usr/bin/gradle' failed with exit code 1"
      #   2) org.gradle.jvmargs 的 -Dhttp.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080
      #      → CI 没这代理，插件解析 Kotlin 2.1.0 / IntelliJ Platform Gradle Plugin
      #        之类的 jar 会被代理卡死到超时（12 分钟后才 FAIL）。
      #
      # 所以这里就地做两件事：
      #   A) sed 替换 org.gradle.java.home 为 actions/setup-java 实际装到的 temurin 路径
      #   B) sed 删除 jvmargs 里所有 proxyHost / proxyPort / nonProxyHosts 参数
      - name: Patch gradle.properties (java.home + strip CI-broken proxy)
        run: |
          set -euo pipefail
          TARGET="${JAVA_HOME:-${{ steps.setup_jdk.outputs.path }}}"
          echo "JAVA_HOME=$JAVA_HOME  => patching org.gradle.java.home => $TARGET"
          if [[ ! -x "$TARGET/bin/java" ]]; then
            echo "❌ target JDK does not have bin/java: $TARGET"
            ls -la "$TARGET" 2>&1 | head -20
            exit 3
          fi
          ESCAPED="$(echo "$TARGET" | sed -E 's/[#&/\\]/\\&/g')"

          # 1. 替换 org.gradle.java.home
          sed -i.bak -E \
            "s|^org.gradle.java.home=.*|org.gradle.java.home=${ESCAPED}|" \
            gradle.properties

          # 2. 把 org.gradle.jvmargs 里所有 -D{http,https}.proxy{Host,Port} /
          #    -Dhttp.nonProxyHosts=... / 行尾续行符先保留，但代理参数必须删除。
          python3 - <<'PY'
          import re
          p='gradle.properties'
          with open(p,'r',encoding='utf-8') as f: s=f.read()
          def strip_proxy(m):
              line=m.group(0)
              # 顺序: nonProxyHosts / proxyPort / proxyHost
              line=re.sub(r'\s*-Dhttp\.nonProxyHosts=[^\\\s]+','',line)
              line=re.sub(r'\s*-Dhttps?\.proxy(Host|Port)=[^\\\s]+','',line)
              # 修正可能出现的前置空格: '=\   -Xmx...' → '=\\\n  -Xmx...' 保持不变
              return line
          # 只匹配 org.gradle.jvmargs=...\(...\\\n  ...\n  ...)* 直到下一行不再以空格续行
          pattern=re.compile(r'^org\.gradle\.jvmargs=.*(?:\\\n.*)*$', re.MULTILINE)
          s2=pattern.sub(strip_proxy, s)
          with open(p,'w',encoding='utf-8') as f: f.write(s2)
          PY

          echo "✅ Patched gradle.properties. Relevant lines:"
          grep -nE "java\.home|jvmargs|proxy" gradle.properties || true

      # 继续用 provisioned gradle-version 8.14（和 release.yml 一致）。
      # 此时 gradle.properties 已替换成本次 runner 真实的 temurin-21 路径。
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Compile Kotlin + buildPlugin
        run: |
          gradle --no-daemon \
            compileKotlin \
            compileTestKotlin \
            buildPlugin \
            -x test

      - name: Upload plugin zip + build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: plugin-build
          path: |
            build/distributions/*.zip
            build/reports/
            build/classes/

  # ------------------------------------------------------------------
  # Job 2: 3 个「独立 Verifier」（纯 Java / 0 环境依赖）
  #   - LessFeatureVerifier            : Less & 选择器展开 / kebab·camel
  #   - InlineStyleConverterVerifier   : JS字面量 → 严格 JSON / 单位(unitless/
  #                                      负数/0/transform scale·rotate·translate)
  #   - ColorToolingVerifier           : 颜色归一化/语义变量名/扫描 + 微基准
  # 三个 Verifier 都只依赖 JDK stdlib，在任何 temurin JDK ≥ 11 上都能通过。
  # ------------------------------------------------------------------
  standalone-verifiers:
    name: Standalone Java verifiers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: (Sanity) 确认 3 个 Verifier.java 都已经被提交到仓库
        run: |
          for f in \
            src/test/java/com/pan/dashstyle/LessFeatureVerifier.java \
            src/test/java/com/pan/dashstyle/InlineStyleConverterVerifier.java \
            src/test/java/com/pan/dashstyle/ColorToolingVerifier.java
          do
            if [[ -f "$f" ]]; then
              echo "✅ found: $f"
            else
              echo "❌ MISSING: $f  —— 必须先把 Verifier 源文件 push 到仓库里"
              exit 2
            fi
          done

      - name: Build & run LessFeatureVerifier
        run: |
          rm -rf /tmp/ver && mkdir -p /tmp/ver
          javac -d /tmp/ver src/test/java/com/pan/dashstyle/LessFeatureVerifier.java
          java -cp /tmp/ver com.pan.dashstyle.LessFeatureVerifier

      - name: Build & run InlineStyleConverterVerifier
        run: |
          rm -rf /tmp/ver && mkdir -p /tmp/ver
          javac -d /tmp/ver src/test/java/com/pan/dashstyle/InlineStyleConverterVerifier.java
          java -cp /tmp/ver com.pan.dashstyle.InlineStyleConverterVerifier

      - name: Build & run ColorToolingVerifier
        run: |
          rm -rf /tmp/ver && mkdir -p /tmp/ver
          javac -d /tmp/ver src/test/java/com/pan/dashstyle/ColorToolingVerifier.java
          java -cp /tmp/ver com.pan.dashstyle.ColorToolingVerifier

  # ------------------------------------------------------------------
  # Job 3: IDE 沙箱集成测试（PSI/UI）
  #   DashStyleIntegrationTest 基于 BasePlatformTestCase，在 headless 沙箱里加载
  #   WebStorm-2025.3 平台 + DashStyle 插件，7 条强断言用例覆盖：
  #     未使用 class 置灰 / 重复声明弱警告 / 抽取公共类 QuickFix /
  #     style 字符串引用跳转 / inline style 提取 Intention / 类可加载。
  #   依赖 Job 1 先编译通过（needs: plugin-build），避免在编译错时白白下载 SDK。
  #   注意：需要 JDK 21 + 首次会下载 WebStorm SDK（体积大、耗时较长）。
  # ------------------------------------------------------------------
  integration-tests:
    name: IDE sandbox integration tests
    needs: plugin-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        id: setup_jdk
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 与 plugin-build 相同的修补：把本地开发机硬编码的 java.home / 代理参数
      # 替换成 CI runner 实际可用的 temurin-21 路径并去掉代理，否则插件解析依赖会失败。
      - name: Patch gradle.properties (java.home + strip CI-broken proxy)
        run: |
          set -euo pipefail
          TARGET="${JAVA_HOME:-${{ steps.setup_jdk.outputs.path }}}"
          echo "JAVA_HOME=$JAVA_HOME  => patching org.gradle.java.home => $TARGET"
          if [[ ! -x "$TARGET/bin/java" ]]; then
            echo "❌ target JDK does not have bin/java: $TARGET"
            ls -la "$TARGET" 2>&1 | head -20
            exit 3
          fi
          ESCAPED="$(echo "$TARGET" | sed -E 's/[#&/\\]/\\&/g')"

          # 1. 替换 org.gradle.java.home
          sed -i.bak -E \
            "s|^org.gradle.java.home=.*|org.gradle.java.home=${ESCAPED}|" \
            gradle.properties

          # 2. 把 org.gradle.jvmargs 里所有代理参数删除
          python3 - <<'PY'
          import re
          p='gradle.properties'
          with open(p,'r',encoding='utf-8') as f: s=f.read()
          def strip_proxy(m):
              line=m.group(0)
              line=re.sub(r'\s*-Dhttp\.nonProxyHosts=[^\\\s]+','',line)
              line=re.sub(r'\s*-Dhttps?\.proxy(Host|Port)=[^\\\s]+','',line)
              return line
          pattern=re.compile(r'^org\.gradle\.jvmargs=.*(?:\\\n.*)*$', re.MULTILINE)
          with open(p,'w',encoding='utf-8') as f: f.write(pattern.sub(strip_proxy, s))
          PY

          echo "✅ Patched gradle.properties. Relevant lines:"
          grep -nE "java\.home|jvmargs|proxy" gradle.properties || true

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      # 集成测试要全新下载 WebStorm SDK + 大量第三方依赖，GitHub Actions 共享
      # runner 的出口 IP 经常被 Maven Central 限流（HTTP 429 Too Many Requests）。
      # 这里给 gradle 套一个重试循环：最多试 5 次、每次递增等待，429/网络抖动
      # 时自动退避重试，避免整个 job 因一次瞬时 429 就失败。
      - name: Run DashStyleIntegrationTest (with retry on 429)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "==================== Attempt $attempt/5 ===================="
            if gradle --no-daemon \
                 test \
                 --tests "com.pan.dashstyle.DashStyleIntegrationTest"; then
              echo "✅ Integration test passed on attempt $attempt"
              exit 0
            fi
            status=$?
            echo "⚠️  Attempt $attempt failed (exit=$status). Waiting before retry..."
            sleep $((attempt * 60))
          done
          echo "❌ Integration test failed after 5 attempts"
          exit 1

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-reports
          path: |
            build/reports/
            build/test-results/
